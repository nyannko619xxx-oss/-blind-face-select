<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blind Face Select｜選考ロジック試験</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d16;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px 70px}.brand{font-size:12px;letter-spacing:.2em;color:#d7aa63;font-weight:800}h1{font-size:clamp(26px,5vw,43px)}p{color:#b6c2d1;line-height:1.6}.panel{background:#121c2b;border:1px solid #344155;border-radius:20px;padding:20px;margin:16px 0}.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.face{aspect-ratio:3/4;border:2px solid #344155;border-radius:15px;background:linear-gradient(145deg,#2a394b,#121c2b);color:white;font-size:clamp(12px,2vw,19px);font-weight:800;cursor:pointer}.face[aria-pressed=true]{border-color:#68a7ff;background:#163456;box-shadow:0 0 0 3px #68a7ff55}.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:13px;padding:14px 20px;background:#d7aa63;color:#111;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#223147;color:#fff}.hidden{display:none}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:18px;border-radius:12px;background:#223147}.face:focus-visible,.btn:focus-visible{outline:3px solid #d7aa63;outline-offset:3px}@media(max-width:700px){.faces{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.faces{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><div class="brand">BLIND FACE SELECT / PHASE 2 EXPERIMENT</div><h1>140候補・選考ロジック試験</h1><p>架空IDだけで予選からTOP9まで進めます。人物写真と本人情報は含みません。選択履歴から次の比較を決め、順位はすべてあなたの選択で確定します。</p>
<section id="home" class="panel"><p>この試験は設計検証用です。画像の取得方法が決まるまで、実在人物の顔写真は表示しません。</p><fieldset><legend>終盤の比較人数（試験条件）</legend><label><input type="radio" name="lateSize" value="3" checked> 3人から1人：比較しやすさを優先</label><br><label><input type="radio" name="lateSize" value="4"> 4人から1人：画面数を削減</label></fieldset><p>どちらも順位はプレイヤーが決めます。4人方式は選ぶ負担が増える可能性があり、選考品質は未検証です。</p><button class="btn" id="start">140候補で開始 →</button></section>
<section id="game" class="panel hidden"><div class="brand" id="phase"></div><h2 id="heading"></h2><p id="progress"></p><div class="faces" id="faces"></div><p id="chosen" role="status"></p><div class="actions"><button class="btn secondary" id="undo" disabled>ひとつ戻る</button><button class="btn" id="next" disabled>選択して次へ →</button><button class="btn secondary" id="reset">最初から</button></div></section>
<section id="done" class="panel hidden"><h2>TOP9 確定</h2><p id="summary"></p><div class="results" id="results"></div><div class="actions"><button class="btn secondary" id="restart">もう一度</button></div></section>
<script type="module">
import {createSelection,nextQuestion,submitChoice} from './selection-engine.js';
const $=id=>document.getElementById(id);let state,question,picks=new Set(),snapshots=[];
const names={preliminary:'PRELIMINARY',main:'MAIN ROUND',late:'LATE ROUND',recovery:'BORDERLINE RECHECK',rank:'DIRECT COMPARISON'};
function show(id){for(const s of document.querySelectorAll('main>section'))s.classList.toggle('hidden',s.id!==id);scrollTo(0,0)}
function render(){question=nextQuestion(state);picks.clear();if(!question){show('done');$('summary').textContent=`全 ${state.history.length} 画面。最終順位は直接比較によるプレイヤー選択です。`;$('results').replaceChildren();state.ranking.forEach((id,i)=>{const div=document.createElement('div');div.className='result';div.textContent=`${i+1}位　${id}`;$('results').append(div)});return}
show('game');$('phase').textContent=names[question.phase];$('heading').textContent=question.phase==='rank'?'好きな方を1人選択':`${question.ids.length}人から${question.max}人まで選択`;$('progress').textContent=`${state.history.length+1}画面目｜選択可能：1〜${question.max}人`;$('faces').replaceChildren();for(const id of question.ids){const b=document.createElement('button');b.type='button';b.className='face';b.textContent=id;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(picks.has(id))picks.delete(id);else if(picks.size<question.max)picks.add(id);for(const face of $('faces').children)face.setAttribute('aria-pressed',String(picks.has(face.textContent)));$('chosen').textContent=`${picks.size}人選択中`;$('next').disabled=picks.size<question.min};$('faces').append(b)}$('chosen').textContent='0人選択中';$('next').disabled=true;$('undo').disabled=snapshots.length===0}
$('start').onclick=()=>{const lateSize=Number(document.querySelector('input[name=lateSize]:checked').value);state=createSelection(Array.from({length:140},(_,i)=>'BLIND #'+String(i+1).padStart(3,'0')),{lateSize});snapshots=[];render()};$('next').onclick=()=>{if(picks.size>=question.min){snapshots.push(JSON.stringify(state));submitChoice(state,[...picks]);render()}};$('undo').onclick=()=>{if(snapshots.length){state=JSON.parse(snapshots.pop());render()}};$('reset').onclick=()=>show('home');$('restart').onclick=()=>show('home');
</script></main></body></html>
