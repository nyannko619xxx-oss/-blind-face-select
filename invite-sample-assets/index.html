<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blind Face Select｜Invite Sample</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111927;color:#f4f1e9}body{margin:0 auto;max-width:700px;padding:20px}h1{font-size:1.45rem}section{background:#202b3b;padding:20px;border-radius:16px;margin:18px 0}button,a.action{font:inherit;color:#101820;background:#e1be75;border:0;border-radius:10px;padding:12px 16px;margin:5px;cursor:pointer;display:inline-block}button:disabled{opacity:.45}a{color:#b5d4ff}#cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.card{min-height:120px;background:#34445a;color:white;padding:5px;font-size:12px}.card[aria-pressed=true]{outline:3px solid #68aeff}#inviteLink{width:100%;box-sizing:border-box;background:#111927;color:white;padding:8px}small{color:#b7c4d1}#status{min-height:2em}
@media(max-width:600px){#cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><h1>Blind Face Select｜匿名招待 Sample v0.1</h1><p>招待の動作確認用です。顔カードは架空fixtureで、実候補・画像・Production選考には接続していません。</p><p id="status" role="status">Sessionを確認中…</p>
<section id="access" hidden><h2>利用開始</h2><p>招待URLを開くと最初の1ブラウザだけが利用できます。</p><a class="action" href="/dev/owner" id="devOwner">ローカルOwnerとして開始</a><small id="accessHelp"></small></section>
<section id="play" hidden><h2>選考画面のアクセス確認</h2><p>匿名Sessionがあるブラウザだけがfixtureを取得できます。2人まで選択できます。</p><div id="cards"></div><p id="choice"></p></section>
<section id="invitePanel" hidden><h2>招待する</h2><p id="quota"></p><button id="makeInvite">本日の招待URLを発行</button><div id="shareArea" hidden><input id="inviteLink" readonly aria-label="招待URL"><button id="share">共有する</button><button id="copy">リンクをコピー</button></div><p><small>同じURLを転送しても最初のClaimだけ有効です。発行枠はJST 0:00に更新され、繰越はありません。</small></p></section>
<script type="module" src="./app.js"></script></body></html>
