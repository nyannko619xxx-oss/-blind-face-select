<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Blind Face Select</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111927;color:#f4f1e9}[hidden]{display:none!important}body{margin:0 auto;max-width:900px;padding:20px}h1{font-size:1.45rem}section{background:#202b3b;padding:20px;border-radius:16px;margin:18px 0}button{font:inherit;color:#101820;background:#e1be75;border:0;border-radius:10px;padding:12px 16px;margin:5px;cursor:pointer}button:disabled{opacity:.45}a{color:#b5d4ff}#status{min-height:2em}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.mode-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px;min-height:140px;margin:0;color:#f5f4ef;background:linear-gradient(140deg,#293d55,#172334);border:1px solid #677b94}.mode-card strong{font-size:1.3rem;color:#f3d292}.mode-card span{font-size:1rem}.mode-card small{font-size:.85rem}#homeButton{background:#32465e;color:white}#home .secondary{background:transparent;border:1px solid #71849c;color:#e5e9ee}.game-faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.game-face{width:100%;padding:3px;background:#34445a;min-height:0;touch-action:manipulation;overflow:hidden}.game-face[aria-pressed=true]{outline:3px solid #68aeff;background:#50729b}.real-portrait{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:#101723}.game-face.image-error{opacity:.5}.uncertain{display:block;margin-top:16px}.owner-result .board{height:min(69svh,650px)}.detail-photo{display:block;max-width:100%;max-height:55svh;object-fit:contain;margin:12px auto}#inviteLink{width:100%;box-sizing:border-box;background:#111927;color:white;padding:8px}small{color:#b7c4d1}@media(max-width:600px){.mode-grid{grid-template-columns:1fr}.mode-card{min-height:100px}.game-faces{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style><link rel="stylesheet" href="./board.css?v=medal-reveal-01"></head><body>
<h1>Blind Face Select</h1><button id="homeButton" hidden>ホームへ</button><p id="status" role="status">準備中…</p>
<section id="home" hidden><p>顔だけで選ぶ。<br>最後にあなたのTOP9を発表します。</p><div id="modes" class="mode-grid"></div><button id="inviteFromHome" class="secondary">友だちを招待する</button><button id="migrateFromHome" class="secondary" hidden>以前の結果を引き継ぐ</button></section>
<section id="access" hidden><h2>利用を開始する</h2><p id="accessMessage"></p><button id="claimInvite" hidden>招待を受け取る</button><button id="beginMigration" hidden>以前の結果を引き継ぐ</button></section>
<button id="retrySession" hidden>再読み込み</button><section id="play" hidden></section>
<section id="invitePanel" hidden><h2>友だちを招待する</h2><p id="quota"></p><button id="makeInvite">招待リンクを作る</button><div id="shareArea" hidden><input id="inviteLink" readonly aria-label="招待URL"><button id="share">共有する</button><button id="copy">リンクをコピー</button></div><p><small>招待は1日1人までです。毎日0:00（日本時間）に更新され、未使用分は繰り越されません。同じリンクは最初に受け取った人だけ利用できます。</small></p></section>
<script type="module" src="./app.js?v=recipient-real-01"></script></body></html>
