<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Face Select｜画像URL技術確認</title><style>:root{color-scheme:dark}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#080d16;color:#f5f7fb;max-width:700px;margin:30px auto;padding:20px}.panel{background:#121c2b;border:1px solid #344155;border-radius:18px;padding:20px}p{line-height:1.6;color:#b6c2d1}input{width:100%;padding:14px;background:#0b1420;border:1px solid #54657b;border-radius:10px;color:white;font-size:16px;box-sizing:border-box}button{margin:12px 0;border:0;background:#d7aa63;color:#111;font-size:16px;font-weight:bold;border-radius:10px;padding:13px 20px}img{display:block;max-width:300px;width:100%;aspect-ratio:3/4;object-fit:cover;margin:14px auto;border:1px solid #54657b;border-radius:12px}img[hidden]{display:none}</style></head><body><div class="panel"><h1>画像URL技術確認</h1><p>画像URLをこの画面で一時的に読み込みます。入力値と画像はこのページからGitHubへ送信・保存されません。画像の提供元には通常の画像リクエストが発生します。表示できることは利用許諾を意味しません。</p><label for="url">画像URL</label><input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://..." required><button id="load">表示を確認</button><p id="status" role="status">未確認</p><img id="photo" hidden alt="読み込んだ画像"></div><script>
const input=document.getElementById('url'),photo=document.getElementById('photo'),status=document.getElementById('status');
document.getElementById('load').onclick=()=>{let parsed;try{parsed=new URL(input.value)}catch{status.textContent='有効なURLを入力してください';return}if(parsed.protocol!=='https:'){status.textContent='HTTPSのURLを入力してください';return}photo.hidden=true;photo.onload=()=>{photo.hidden=false;status.textContent=`表示成功：${photo.naturalWidth} × ${photo.naturalHeight} px`};photo.onerror=()=>{photo.hidden=true;status.textContent='表示できませんでした。提供元の制限・URL変更・通信状況を確認してください。'};status.textContent='読み込み中…';photo.src=parsed.href};
</script></body></html>
