<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blind Face Select</title><link rel="stylesheet" href="app.css"></head><body><main><header><span>BLIND FACE LAB / PERSONAL EDITION</span><h1>Blind Face Select</h1><p>顔だけを見て選ぶ。結果はあなたの選択だけで決まります。</p></header>
<section id="setup" class="panel"><h2>PLAYER SETUP</h2><label>保存済みプレイヤー<select id="playerList"><option value="">新しいプレイヤー</option></select></label><label>Nickname（任意）<input id="nickname" maxlength="30" placeholder="例：Satoru"></label><label>Age Bracket（分析用）<select id="age"><option value="">回答しない</option><option>10代</option><option>20代</option><option>30代</option><option>40代</option><option>50代</option><option>60代以上</option></select></label><label>候補セット<select id="set"><option value="demo">架空ID 140人・操作試験</option><option value="catalog" disabled>端末内の写真カタログを確認中…</option></select></label><p id="catalogMessage" role="status"></p><p><a href="catalog.html">写真カタログの技術設定</a>｜写真の権利・配布方式は確認中です。</p><button id="begin" class="primary">開始する</button><button id="resume" hidden>保存した続きから再開</button><button id="past" hidden>保存した結果を見る</button></section>
<section id="game" class="panel" hidden><div class="eyebrow" id="phase"></div><h2 id="instruction"></h2><p id="progress"></p><div id="faces" class="faces"></div><label class="uncertain"><input type="checkbox" id="uncertain"> この比較は迷った</label><p id="gameStatus" role="status"></p><div class="actions"><button id="undo">ひとつ戻る</button><button id="next" class="primary" disabled>選択して次へ</button><button id="leave">保存して中断</button></div></section>
<section id="result" class="panel" hidden><div class="eyebrow">RESULT / TOP9</div><h2>TOP9 が確定しました</h2><p id="resultInfo"></p><div id="ranking" class="ranking"></div><button id="reveal" class="primary">9位から Reveal</button><div id="analysis" hidden><h3>選択履歴と傾向</h3><div id="analysisBody"></div><h3>期限付き結果共有</h3><p>共有URLを知る人は、期限内に結果の名前・所属・画像URLを閲覧できます。期限判定は閲覧端末の時刻を使います。</p><label>有効期限<select id="expiry"><option value="1">1時間</option><option value="6">6時間</option><option value="24" selected>24時間</option><option value="72">3日</option><option value="168">7日</option><option value="custom">Custom</option></select></label><label id="customWrap" hidden>時間数（1〜720）<input id="customHours" type="number" min="1" max="720" value="24"></label><button id="makeShare">共有URLを作成</button><textarea id="shareLink" readonly rows="3" aria-label="共有URL" hidden></textarea><p id="shareStatus" role="status"></p></div><div class="actions"><button id="resultHome">プレイヤー選択に戻る</button></div></section>
<section id="shared" class="panel" hidden><h2>共有された TOP9</h2><p id="sharedStatus"></p><div id="sharedRanking" class="ranking"></div></section></main><script type="module" src="app.js"></script></body></html>
