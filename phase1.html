<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blind Face Select｜実写表示テスト</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#111925;--line:#344155;--text:#f5f7fb;--muted:#acb8c8;--gold:#d7aa63;--blue:#68a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:1200px;min-height:100dvh;margin:auto;padding:clamp(16px,3vw,32px);background:radial-gradient(circle at 80% 0,#19263a,#0b111b 42%,#070b12 80%)}
.brand{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:800}h1{font-size:clamp(28px,5vw,46px);margin:12px 0}h2{margin:8px 0 14px}.muted{color:var(--muted);line-height:1.6}.small{font-size:13px}.panel{background:linear-gradient(#151e2b,#101722);border:1px solid var(--line);border-radius:20px;padding:20px;margin:18px 0}
button,.link{font:inherit;cursor:pointer}.btn,.link{display:inline-block;border:0;border-radius:14px;padding:13px 20px;background:var(--gold);color:#111;font-weight:800;text-decoration:none}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#1b2636;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions>*{flex:1 1 180px;text-align:center}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.slot{min-width:0}.slot label{display:block;margin:0 0 7px;color:var(--muted);font-size:13px}.slot input{width:100%;font-size:12px;color:var(--muted)}.slot img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center;display:block;border:1px solid var(--line);border-radius:14px;background:#192436;margin-bottom:10px}
.controls{display:flex;gap:5px;flex-wrap:wrap}.controls button{border:1px solid var(--line);border-radius:8px;background:#1a2637;color:var(--text);padding:6px 9px;font-size:12px}.controls button:focus-visible,.card:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0}.faces.four{grid-template-columns:repeat(4,minmax(0,1fr))}.faces.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:750px;margin-inline:auto}.card{position:relative;width:100%;padding:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#111925;color:var(--text);text-align:left}.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.card span{display:block;padding:9px 12px;font-size:12px;letter-spacing:.1em}.card[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 0 4px #68a7ff55}.card[aria-pressed=true]:after{content:'選択中';position:absolute;right:8px;top:8px;border-radius:8px;background:#17345b;color:white;padding:6px 8px;font-size:12px;font-weight:800}
.hidden{display:none!important}.status{min-height:1.6em;color:var(--muted)}.result{max-width:280px;margin:18px auto}.result img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid var(--blue)}
@media(max-width:700px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.faces,.faces.four{grid-template-columns:repeat(2,minmax(0,1fr))}.faces.three{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:16px}.panel{padding:15px}}
@media(max-width:440px){.faces.three{grid-template-columns:repeat(2,minmax(0,1fr))}.card span{padding:7px;font-size:11px}}
</style></head><body><main>
<div class="brand">BLIND FACE SELECT / PHASE 1</div><h1>実写5枚の表示テスト</h1>
<section id="setup"><p class="muted">端末から写真を5枚選び、切り抜きと比較画面を確認します。写真はこのページ内だけで表示され、サーバーへ送信されません。ページを閉じると選択は消えます。</p>
<div class="panel"><h2>写真を設定</h2><p class="muted small">写真は自分が使用してよいものを選んでください。ファイル名は比較中に表示されません。</p><div class="slots" id="slots"></div><p id="uploadStatus" class="status" role="status"></p></div>
<div class="actions"><a class="link secondary" href="index.html">v0.3 チュートリアルへ</a><button class="btn" id="start" disabled>5枚で表示テストを始める →</button></div></section>
<section id="compare" class="hidden"><div class="panel"><div class="brand" id="stageName"></div><h2 id="instruction"></h2><p class="muted small" id="stageNote"></p><div id="faces" class="faces"></div><p id="selectionStatus" class="status" role="status"></p><div class="actions"><button class="btn secondary" id="back">戻る</button><button class="btn" id="next" disabled>次へ →</button></div></div></section>
<section id="result" class="hidden"><div class="panel" style="text-align:center"><div class="brand">DISPLAY TEST COMPLETE</div><h2>表示と操作の確認完了</h2><p class="muted">この1人は最終画面の表示テスト結果です。5枚だけの試験であり、TOP9や好み分析ではありません。</p><div class="result" id="resultImage"></div><p id="resultId"></p><div class="actions"><button class="btn secondary" id="again">写真を選び直す</button></div></div></section>
</main><script>
(()=>{
const $=id=>document.getElementById(id), urls=Array(5).fill(null), positions=Array.from({length:5},()=>({x:50,y:50}));
let stage=0, choice=new Set(), chosenPre=[], chosenMain=[], shown=[];
const labels=['PRELIMINARY','MAIN ROUND','FINAL'], limits=[2,2,1], number=i=>'BLIND #'+String(i+1).padStart(2,'0');
function view(id){for(const section of document.querySelectorAll('main>section'))section.classList.toggle('hidden',section.id!==id);scrollTo(0,0)}
function ready(){const n=urls.filter(Boolean).length;$('start').disabled=n!==5;$('uploadStatus').textContent=`${n} / 5 枚設定済み`}
function imgFor(i){const img=document.createElement('img');img.src=urls[i];img.alt=number(i)+' の写真';img.style.objectPosition=`${positions[i].x}% ${positions[i].y}%`;return img}
for(let i=0;i<5;i++){
 const slot=document.createElement('div');slot.className='slot';const label=document.createElement('label');label.textContent=number(i);label.htmlFor='file'+i;
 const preview=document.createElement('img');preview.alt='写真未選択';preview.style.visibility='hidden';
 const input=document.createElement('input');input.type='file';input.accept='image/*';input.id='file'+i;input.setAttribute('aria-label',number(i)+' の写真');
 input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){input.value='';return}if(urls[i])URL.revokeObjectURL(urls[i]);urls[i]=URL.createObjectURL(file);preview.src=urls[i];preview.alt=number(i)+' の写真';preview.style.visibility='visible';ready()});
 const controls=document.createElement('div');controls.className='controls';for(const [text,dx,dy] of [['左',-10,0],['右',10,0],['上',0,-10],['下',0,10]]){const button=document.createElement('button');button.type='button';button.textContent=text;button.setAttribute('aria-label',number(i)+' の切り抜きを'+text+'へ');button.onclick=()=>{positions[i].x=Math.max(0,Math.min(100,positions[i].x+dx));positions[i].y=Math.max(0,Math.min(100,positions[i].y+dy));preview.style.objectPosition=`${positions[i].x}% ${positions[i].y}%`};controls.append(button)}
 slot.append(label,preview,input,controls);$('slots').append(slot)
}
function candidates(){if(stage===0)return [0,1,2,3,4];if(stage===1)return [...chosenPre,...[0,1,2,3,4].filter(i=>!chosenPre.includes(i)).slice(0,4-chosenPre.length)];return [...chosenMain,...[0,1,2,3,4].filter(i=>!chosenMain.includes(i)).slice(0,3-chosenMain.length)]}
function render(){view('compare');choice.clear();shown=candidates();$('stageName').textContent=labels[stage];$('instruction').textContent=stage===2?'3人から1人選択':'気になる顔を最大2人選択';$('stageNote').textContent=`${stage+1} / 3｜${stage===0?'5人':stage===1?'4人':'3人'}表示。これは画面確認用の簡易進行です。`;const faces=$('faces');faces.className='faces '+(stage===1?'four':stage===2?'three':'');faces.replaceChildren();for(const i of shown){const button=document.createElement('button');button.type='button';button.className='card';button.setAttribute('aria-pressed','false');button.append(imgFor(i));const label=document.createElement('span');label.textContent=number(i);button.append(label);button.onclick=()=>{if(choice.has(i))choice.delete(i);else if(choice.size<limits[stage])choice.add(i);for(const card of faces.children){const id=Number(card.dataset.index);card.setAttribute('aria-pressed',String(choice.has(id)))}update()};button.dataset.index=i;faces.append(button)}update()}
function update(){$('selectionStatus').textContent=`${choice.size} / ${limits[stage]} 人選択中（1人以上選択）`;$('next').disabled=choice.size===0}
$('start').onclick=()=>{if(urls.some(u=>!u))return;stage=0;render()};
$('next').onclick=()=>{if(!choice.size)return;if(stage===0){chosenPre=[...choice];stage=1;render()}else if(stage===1){chosenMain=[...choice];stage=2;render()}else{const i=[...choice][0];$('resultImage').replaceChildren(imgFor(i));$('resultId').textContent=number(i);view('result')}};
$('back').onclick=()=>{if(stage===0)view('setup');else{stage--;render()}};
$('again').onclick=()=>view('setup');window.addEventListener('pagehide',()=>urls.forEach(u=>{if(u)URL.revokeObjectURL(u)}));ready();
})();
</script></body></html>
