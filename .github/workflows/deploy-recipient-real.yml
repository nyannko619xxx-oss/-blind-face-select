name: Deploy encrypted Recipient Real Play
on:
  push:
    branches: [checkpoint/productionization-gate]
    paths: [.github/workflows/deploy-recipient-real.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Local invariants
        run: |
          cmp selection-engine.js production/assets/selection-engine.js
          cmp invite-sample-assets/reveal-board.js production/assets/reveal-board.js
          cmp invite-sample-assets/board.css production/assets/board.css
          node verify-production.mjs
          node verify-owner-real.mjs
          node verify-owner-persistence.mjs
      - name: Prepare separate Production configuration
        run: node production/prepare-deploy.mjs
      - name: Browser verification before live mutation
        run: |
          npm install --no-save --ignore-scripts wrangler@4.45.0 playwright@1.55.0
          npx playwright install chromium
          node verify-production-browser.mjs
      - name: Add encrypted invite column to Production D1
        run: node production/apply-private-invite-migration.mjs
      - name: Deploy Production Worker and assets
        run: npx wrangler deploy --config=.production.wrangler.json
      - name: Verify live Production Invite and large encrypted transfer
        run: node production/verify-live.mjs
      - name: Erase temporary account configuration
        if: always()
        run: rm -f .production.wrangler.json .migration-test.wrangler.json
