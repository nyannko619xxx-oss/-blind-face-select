name: Deploy isolated anonymous invite test
on:
  push:
    branches: [checkpoint/anonymous-invite-sample-v0.1]
    paths: [.github/workflows/deploy-invite-test.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-invite-test-deploy
  cancel-in-progress: false
jobs:
  deploy_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dedicated resources and prepare ephemeral configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('token_secret_missing');
          const api=async path=>{
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
            if(!r.ok)throw Error('cloudflare_http_'+r.status);
            const data=await r.json();if(data.success!==true)throw Error('cloudflare_api_unsuccessful');return data.result;
          };
          (async()=>{
            const accounts=await api('/accounts?per_page=50');
            if(accounts.length!==1)throw Error('account_not_unique');
            const accountId=accounts[0].id;
            if(!/^[a-f0-9]{32}$/i.test(accountId))throw Error('account_id_invalid');
            const databases=await api('/accounts/'+accountId+'/d1/database?name=blind-face-select-invite-test-v01&per_page=50');
            const exact=databases.filter(x=>x.name==='blind-face-select-invite-test-v01');
            if(exact.length!==1)throw Error('dedicated_d1_not_unique');
            const databaseId=exact[0].uuid;
            if(!/^[a-f0-9-]{36}$/i.test(databaseId))throw Error('d1_id_invalid');
            const secrets=await api('/accounts/'+accountId+'/workers/scripts/blind-face-select-invite-test-v01/secrets');
            if(!Array.isArray(secrets)||secrets.some(x=>x.name==='OWNER_BOOTSTRAP_CODE'))throw Error('owner_code_already_configured');
            const marker=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('blind-face-select:owner-bootstrap:v0.1'));
            const markerHex=Array.from(new Uint8Array(marker),b=>b.toString(16).padStart(2,'0')).join('');
            const q=await fetch('https://api.cloudflare.com/client/v4/accounts/'+accountId+'/d1/database/'+databaseId+'/query',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sql:'SELECT count(*) AS n FROM anonymous_sessions WHERE claimed_invite_hash = ?',params:[markerHex]})});
            if(!q.ok)throw Error('owner_slot_probe_http_'+q.status);
            const state=await q.json();if(!state.success||state.result?.[0]?.results?.[0]?.n!==0)throw Error('owner_slot_not_available');
            const domain=await api('/accounts/'+accountId+'/workers/subdomain');
            if(!/^[a-z0-9-]+$/.test(domain.subdomain))throw Error('workers_subdomain_unavailable');
            const origin='https://blind-face-select-invite-test-v01.'+domain.subdomain+'.workers.dev';
            const config={
              name:'blind-face-select-invite-test-v01',
              account_id:accountId,
              main:'invite-sample-worker.mjs',
              compatibility_date:'2026-09-28',
              workers_dev:true,
              assets:{directory:'./invite-sample-assets',run_worker_first:['/v1/*']},
              d1_databases:[{binding:'INVITE_DB',database_name:'blind-face-select-invite-test-v01',database_id:databaseId}],
              vars:{APP_ORIGIN:origin}
            };
            fs.writeFileSync('.invite-test.wrangler.json',JSON.stringify(config));
            fs.appendFileSync(process.env.GITHUB_ENV,'SAMPLE_ORIGIN='+origin+'\n');
            console.log('dedicated_account_d1_and_origin_resolved');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-z0-9_]/gi,'_'));process.exitCode=1});
          NODE
      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4.45.0
      - name: Apply isolated test schema
        run: npx wrangler d1 execute blind-face-select-invite-test-v01 --remote --file=./invite-sample-schema.sql --config=.invite-test.wrangler.json --yes
      - name: Deploy fixture-only Worker and assets
        run: npx wrangler deploy --config=.invite-test.wrangler.json
      - name: Register ephemeral sample bootstrap secret
        shell: bash
        run: |
          node -e "require('node:fs').writeFileSync('.invite-test-admin',require('node:crypto').randomBytes(32).toString('hex'))"
          node -e "require('node:fs').writeFileSync('.invite-test-owner',require('node:crypto').randomBytes(32).toString('hex'))"
          chmod 600 .invite-test-admin .invite-test-owner
          npx wrangler secret put ADMIN_SECRET --config=.invite-test.wrangler.json < .invite-test-admin
          npx wrangler secret put OWNER_BOOTSTRAP_CODE --config=.invite-test.wrangler.json < .invite-test-owner
      - name: Verify real D1 endpoint and isolated invite chain
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const origin=process.env.SAMPLE_ORIGIN,admin=fs.readFileSync('.invite-test-admin','utf8');
          const cfg=JSON.parse(fs.readFileSync('.invite-test.wrangler.json','utf8'));
          const dbChange=async (sql,param)=>{
            const url='https://api.cloudflare.com/client/v4/accounts/'+cfg.account_id+'/d1/database/'+cfg.d1_databases[0].database_id+'/query';
            const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params:[param]})});
            if(!r.ok)throw Error('d1_query_http_'+r.status);
            const data=await r.json();if(!data.success||!data.result?.[0]?.success)throw Error('d1_query_failed');
          };
          const request=async (path,{method='GET',token,body,foreign=false}={})=>{
            const headers={'Content-Type':'application/json',Origin:foreign?'https://foreign.invalid':origin};
            if(token)headers.Authorization='Bearer '+token;
            const r=await fetch(origin+path,{method,headers,body:body?JSON.stringify(body):undefined});
            const kind=r.headers.get('content-type')||'none';if(!kind.includes('application/json'))throw Error('non_json_'+path.replaceAll('/','_')+'_'+r.status+'_'+kind.replace(/[^a-z0-9]/gi,'_'));const value=await r.json();return {status:r.status,value};
          };
          const expect=(r,status,label)=>{if(r.status!==status)throw Error(label+'_status_'+r.status);return r.value};
          (async()=>{
            await new Promise(resolve=>setTimeout(resolve,5000));
            const page=await fetch(origin+'/index.html');
            if(page.status!==200||!(await page.text()).includes('Blind Face Select'))throw Error('asset_not_served');
            expect(await request('/v1/sample/fixture'),401,'unauthorized_fixture');
            expect(await request('/v1/sample/fixture',{foreign:true}),403,'foreign_origin');
            expect(await request('/v1/sample/admin/bootstrap',{method:'POST'}),401,'unauthorized_bootstrap');
            const owner=expect(await request('/v1/sample/admin/bootstrap',{method:'POST',token:admin}),201,'owner_bootstrap').sessionToken;
            const fixture=expect(await request('/v1/sample/fixture',{token:owner}),200,'authorized_fixture');
            if(fixture.cards.length!==5||!fixture.experimental)throw Error('fixture_invalid');
            const invite=expect(await request('/v1/sample/invites',{method:'POST',token:owner}),201,'owner_invite').inviteToken;
            expect(await request('/v1/sample/invites',{method:'POST',token:owner}),409,'daily_limit');
            const attempts=await Promise.all(Array.from({length:20},()=>request('/v1/sample/claim',{method:'POST',body:{inviteToken:invite}})));
            const winners=attempts.filter(r=>r.status===201),losers=attempts.filter(r=>r.status===410);
            if(winners.length!==1||losers.length!==19)throw Error('claim_race_'+winners.length+'_'+losers.length);
            expect(await request('/v1/sample/claim',{method:'POST',body:{inviteToken:invite}}),410,'used_invite');
            const recipient=winners[0].value.sessionToken;
            expect(await request('/v1/sample/session',{token:recipient}),200,'recipient_session');
            const nextInvite=expect(await request('/v1/sample/invites',{method:'POST',token:recipient}),201,'recipient_reinvite').inviteToken;
            const tampered=nextInvite.slice(0,-1)+(nextInvite.endsWith('0')?'1':'0');
            expect(await request('/v1/sample/claim',{method:'POST',body:{inviteToken:tampered}}),410,'tampered_invite');
            await dbChange('UPDATE single_use_invites SET expires_at = 0 WHERE token_hash = ?',crypto.createHash('sha256').update(nextInvite).digest('hex'));
            expect(await request('/v1/sample/claim',{method:'POST',body:{inviteToken:nextInvite}}),410,'expired_invite');
            const expiry=expect(await request('/v1/sample/invites',{method:'POST',token:recipient}),409,'recipient_daily_limit');
            if(!expiry.jstDay)throw Error('daily_limit_day_missing');
            await dbChange('UPDATE anonymous_sessions SET expires_at = 0 WHERE token_hash = ?',crypto.createHash('sha256').update(recipient).digest('hex'));
            expect(await request('/v1/sample/session',{token:recipient}),401,'expired_session');
            const humanCode=fs.readFileSync('.invite-test-owner','utf8');
            expect(await request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:'0'.repeat(64)}}),403,'wrong_owner_code');
            const ownerClaims=await Promise.all(Array.from({length:20},()=>request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:humanCode}})));
            const humanWinners=ownerClaims.filter(r=>r.status===201),humanLosers=ownerClaims.filter(r=>r.status===410);
            try{
              if(humanWinners.length!==1||humanLosers.length!==19)throw Error('owner_claim_race_'+humanWinners.length+'_'+humanLosers.length+'_other_'+ownerClaims.filter(r=>r.status!==201&&r.status!==410).map(r=>r.status).join('_'));
              expect(await request('/v1/sample/fixture',{token:humanWinners[0].value.sessionToken}),200,'human_owner_fixture');
              expect(await request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:humanCode}}),410,'owner_once');
            }finally{
              await dbChange('DELETE FROM anonymous_sessions WHERE claimed_invite_hash = ?',crypto.createHash('sha256').update('blind-face-select:owner-bootstrap:v0.1').digest('hex'));
            }
            console.log('live_asset_auth_invite_20way_owner_20way_expiry_tamper_pass');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-z0-9_]/gi,'_'));process.exitCode=1});
          NODE
      - name: Remove test-only bootstrap secrets
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          if(!fs.existsSync('.invite-test.wrangler.json'))process.exit(0);
          const cfg=JSON.parse(fs.readFileSync('.invite-test.wrangler.json','utf8'));
          (async()=>{
            for(const name of ['OWNER_BOOTSTRAP_CODE','ADMIN_SECRET']){
              const url='https://api.cloudflare.com/client/v4/accounts/'+cfg.account_id+'/workers/scripts/'+cfg.name+'/secrets/'+name;
              const r=await fetch(url,{method:'DELETE',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
              if(r.status!==404&&(!r.ok||(await r.json()).success!==true))throw Error('secret_cleanup_'+name+'_'+r.status);
            }
            console.log('test_bootstrap_secrets_removed');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Erase ephemeral bootstrap material
        if: always()
        run: rm -f .invite-test-admin .invite-test-owner .invite-test.wrangler.json
