name: Deploy isolated fixture selection v0.2
on:
  push:
    branches: [checkpoint/anonymous-invite-sample-v0.1]
    paths: [.github/workflows/deploy-invite-v02-test.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Local sample regression
        run: |
          node --check invite-sample-assets/app.js
          node verify-invite-sample.mjs
          node verify-invite-sample-http.mjs
          node verify-owner-persistence.mjs
          node verify-invite-sample-v02.mjs
      - name: Resolve exact isolated resources and preserve registered Owner Secret
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('token_secret_missing');
          const api=async path=>{
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+token}});
            if(!r.ok)throw Error('cloudflare_http_'+r.status);
            const data=await r.json();if(!data.success)throw Error('cloudflare_api_failed');return data.result;
          };
          (async()=>{
            const accounts=await api('/accounts?per_page=50');if(accounts.length!==1)throw Error('account_not_unique');
            const account=accounts[0].id,name='blind-face-select-invite-test-v01';
            const databases=await api('/accounts/'+account+'/d1/database?name='+name+'&per_page=50');
            const exact=databases.filter(x=>x.name===name);if(exact.length!==1)throw Error('d1_not_unique');
            const secrets=await api('/accounts/'+account+'/workers/scripts/'+name+'/secrets');
            if(!Array.isArray(secrets)||!secrets.some(x=>x.name==='OWNER_BOOTSTRAP_CODE'))throw Error('human_owner_secret_missing');
            const domain=await api('/accounts/'+account+'/workers/subdomain');
            if(!/^[a-z0-9-]+$/.test(domain.subdomain))throw Error('subdomain_unavailable');
            const origin='https://'+name+'.'+domain.subdomain+'.workers.dev';
            const cfg={name,account_id:account,main:'invite-sample-worker.mjs',compatibility_date:'2026-09-28',workers_dev:true,
              assets:{directory:'./invite-sample-assets',run_worker_first:['/v1/*']},
              d1_databases:[{binding:'INVITE_DB',database_name:name,database_id:exact[0].uuid}],vars:{APP_ORIGIN:origin}};
            fs.writeFileSync('.owner-repair.wrangler.json',JSON.stringify(cfg));
            fs.appendFileSync(process.env.GITHUB_ENV,'SAMPLE_ORIGIN='+origin+'\n');
            console.log('human_owner_secret_present_exact_test_resources_resolved');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-z0-9_]/gi,'_'));process.exitCode=1});
          NODE
      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts wrangler@4.45.0
      - name: Deploy fixture UI preserving existing Worker Secret
        run: npx wrangler deploy --config=.owner-repair.wrangler.json
      - name: Verify live route, Secret binding and Invite regression
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const cfg=JSON.parse(fs.readFileSync('.owner-repair.wrangler.json','utf8'));
          const origin=process.env.SAMPLE_ORIGIN;
          const api=async(sql,params=[])=>{
            const u='https://api.cloudflare.com/client/v4/accounts/'+cfg.account_id+'/d1/database/'+cfg.d1_databases[0].database_id+'/query';
            const r=await fetch(u,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            if(!r.ok)throw Error('d1_http_'+r.status);
            const x=await r.json();if(!x.success||!x.result?.[0]?.success)throw Error('d1_query_failed');return x.result[0].results;
          };
          const request=async(path,{method='GET',token,body,foreign=false}={})=>{
            const headers={'Content-Type':'application/json',Origin:foreign?'https://foreign.invalid':origin};
            if(token)headers.Authorization='Bearer '+token;
            const r=await fetch(origin+path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});
            const value=await r.json();return {status:r.status,value};
          };
          const expect=(r,status,label)=>{if(r.status!==status)throw Error(label+'_status_'+r.status);return r.value};
          (async()=>{
            let assetsReady=false;
            for(let attempt=0;attempt<8;attempt++){
              await new Promise(resolve=>setTimeout(resolve,5000));
              const html=await fetch(origin+'/?v=sample-v02-1',{cache:'no-store'});
              const page=await html.text();
              const js=await fetch(origin+'/app.js?v=sample-v02-1',{cache:'no-store'});
              const source=fs.readFileSync('invite-sample-assets/app.js','utf8');
              assetsReady=html.status===200&&page.includes('id="play"')&&page.includes('id="restoreOwner"')&&page.includes('id="ownerMessage"')&&page.includes('sample-v02-1')&&page.includes('[hidden]{display:none!important}')&&page.includes('app.js?v=sample-v02-1')&&js.status===200&&(await js.text())===source;
              if(assetsReady)break;
            }
            if(!assetsReady)throw Error('v02_assets_not_propagated');
            const game=await fetch(origin+'/game.js?v=sample-v02-1',{cache:'no-store'});
            if(game.status!==200||(await game.text())!==fs.readFileSync('invite-sample-assets/game.js','utf8'))throw Error('game_asset_not_propagated');
            const engine=await fetch(origin+'/selection-engine.js',{cache:'no-store'});
            if(engine.status!==200||(await engine.text())!==fs.readFileSync('selection-engine.js','utf8'))throw Error('engine_asset_not_propagated');
            expect(await request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:'bad'}}),400,'owner_bad_shape');
            expect(await request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:'0'.repeat(64)}}),403,'owner_wrong_code');
            expect(await request('/v1/sample/owner/claim'),401,'owner_wrong_method');
            expect(await request('/dev/owner'),404,'local_route_absent');
            expect(await request('/v1/sample/fixture'),401,'fixture_unauthorized');
            expect(await request('/v1/sample/invites',{method:'POST'}),401,'invite_unauthorized');
            expect(await request('/v1/sample/owner/claim',{method:'POST',body:{ownerCode:'0'.repeat(64)},foreign:true}),403,'foreign_origin');
            const token=crypto.randomBytes(32).toString('hex'),id=crypto.randomBytes(32).toString('hex'),now=Date.now();
            const hash=x=>crypto.createHash('sha256').update(x).digest('hex');
            await api('INSERT INTO anonymous_sessions (session_id, token_hash, claimed_invite_hash, created_at, expires_at) VALUES (?, ?, NULL, ?, ?)',[id,hash(token),String(now),String(now+3600000)]);
            try{
              const invite=expect(await request('/v1/sample/invites',{method:'POST',token}),201,'invite_issue').inviteToken;
              const child=expect(await request('/v1/sample/claim',{method:'POST',body:{inviteToken:invite}}),201,'invite_claim').sessionToken;
              expect(await request('/v1/sample/claim',{method:'POST',body:{inviteToken:invite}}),410,'invite_reuse');
              expect(await request('/v1/sample/fixture',{token:child}),200,'recipient_fixture');
              expect(await request('/v1/sample/invites',{method:'POST',token:child}),201,'recipient_reinvite');
              await api('DELETE FROM single_use_invites WHERE issuer_session_id IN (SELECT session_id FROM anonymous_sessions WHERE session_id = ? OR claimed_invite_hash = ?)',[id,hash(invite)]);
              await api('DELETE FROM anonymous_sessions WHERE session_id = ? OR claimed_invite_hash = ?',[id,hash(invite)]);
            }finally{
              // Cleanup is scoped to this temporary seed and its direct recipient.
              await api('DELETE FROM single_use_invites WHERE issuer_session_id = ?',[id]);
              await api('DELETE FROM anonymous_sessions WHERE session_id = ?',[id]);
            }
            const marker=hash('blind-face-select:owner-bootstrap:v0.1');
            const count=await api('SELECT count(*) AS n FROM anonymous_sessions WHERE claimed_invite_hash = ?',[marker]);
            if(count[0].n!==0)throw Error('human_owner_slot_not_empty');
            console.log('live_v02_assets_owner_secret_and_invite_regression_pass');
          })().catch(e=>{console.error(String(e.message).replace(/[^a-z0-9_]/gi,'_'));process.exitCode=1});
          NODE
      - name: Erase temporary config
        if: always()
        run: rm -f .owner-repair.wrangler.json
