name: Deploy separate Owner Real Play
on:
  push:
    branches: [checkpoint/productionization-gate]
    paths: [.github/workflows/deploy-owner-production.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Local isolation and baseline checks
        run: |
          node --check production/worker.mjs
          node --check production/assets/app.js
          node --check invite-sample-assets/migration.js
          cmp selection-engine.js production/assets/selection-engine.js
          cmp invite-sample-assets/reveal-board.js production/assets/reveal-board.js
          cmp invite-sample-assets/board.css production/assets/board.css
          node verify-production.mjs
          node verify-owner-real.mjs
          node verify-owner-persistence.mjs
      - name: Resolve exact account and distinct databases
        run: node production/prepare-deploy.mjs
      - name: Install pinned Wrangler and browser harness
        run: npm install --no-save --ignore-scripts wrangler@4.45.0 playwright@1.55.0
      - name: Install browser for private migration E2E
        run: |
          npx playwright install chromium
          node verify-production-browser.mjs
      - name: Apply production schema only
        run: npx wrangler d1 execute blind-face-select-prod-v01 --remote --file=production/schema.sql --config=.production.wrangler.json
      - name: Deploy isolated production Worker and Owner UI
        run: npx wrangler deploy --config=.production.wrangler.json
      - name: Verify production surface and invite API
        run: node production/verify-live.mjs
      - name: Add migration page to existing Test origin without changing Test API
        run: npx wrangler deploy --config=.migration-test.wrangler.json
      - name: Verify migration asset propagation and original Test core
        run: node production/verify-test-bridge.mjs
      - name: Erase temporary account configuration
        if: always()
        run: rm -f .production.wrangler.json .migration-test.wrangler.json
