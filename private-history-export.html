</style></head><body><main><small>BLIND FACE LAB / PRIVATE EXPORT</small><h1>選考履歴を端末内から保存</h1><section class="panel"><p>同じブラウザの<a href="app.html">Blind Face Select</a>で完了した実候補セッションを選びます。選考内容は変更しません。</p><label>完了したセッション<select id="sessions" disabled><option>読み込み中…</option></select></label><button id="download" disabled>非公開JSONを保存</button><p id="status" role="status"></p></section><p>JSONには候補ID、表示・選択履歴、迷った申告、TOP9、候補セットと実施日時が含まれます。名前・所属・画像URL・Nickname・Ageは含めません。ただし、別の候補Masterと照合すれば選択内容が分かるため、公開Repositoryや公開リンクへ置かないでください。</p><footer>このページは端末の保存済みSessionを読み取るだけです。サーバーへ履歴を送信しません。</footer></main><script type="module" src="private-history-export.mjs"></script></body></html>
